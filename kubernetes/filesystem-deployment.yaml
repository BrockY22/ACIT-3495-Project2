apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: filesystem
  name: filesystem
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: filesystem
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: filesystem
    spec:
      containers:
        - env:
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  key: AUTH_SERVICE_URL
                  name: env
            - name: CREDENTIALS_DB
              valueFrom:
                configMapKeyRef:
                  key: CREDENTIALS_DB
                  name: env
            - name: FILE_SYSTEM_URL
              valueFrom:
                configMapKeyRef:
                  key: FILE_SYSTEM_URL
                  name: env
            - name: MEDIA_DB
              valueFrom:
                configMapKeyRef:
                  key: MEDIA_DB
                  name: env
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  key: MYSQL_HOST
                  name: env
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                configMapKeyRef:
                  key: MYSQL_ROOT_PASSWORD
                  name: env
            - name: SECRET_KEY
              valueFrom:
                configMapKeyRef:
                  key: SECRET_KEY
                  name: env
          image: kiawnu/filesystem-2:v1
          name: file-system-service
          ports:
            - containerPort: 5001
              protocol: TCP
          volumeMounts:
            - mountPath: /media-data
              name: media-data
      restartPolicy: Always
      volumes:
        - name: media-data
          persistentVolumeClaim:
            claimName: media-data
